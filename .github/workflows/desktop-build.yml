name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - release.json
      - .gitattributes
      - .github/workflows/desktop-build.yml
      - packaging/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }} candidate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2022
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      LJQC_DEPLOYMENT_MODE: desktop
    steps:
      - name: Keep identical source bytes on both platforms
        shell: bash
        run: git config --global core.autocrlf false
      - name: Check out this commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Run guarded source checks
        run: python packaging/ci_run_checks.py --output output/ci-checks
      - name: Prepare Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/prepare_windows_ci.ps1
      - name: Build Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./packaging/build_windows_release.ps1
          -PythonExe (Get-Command python).Source
          -OutputRoot "$env:GITHUB_WORKSPACE/output/github-build/windows"
          -InnoCompiler $env:LJQC_CI_INNO_COMPILER
          -ChineseMessagesFile $env:LJQC_CI_CHINESE_MESSAGES
      - name: Verify Windows payload and export installer
        if: runner.os == 'Windows'
        run: python packaging/ci_verify_windows.py --build-root output/github-build/windows --output output/ci-artifacts/windows
      - name: Build Mac Apple Silicon DMG
        if: runner.os == 'macOS'
        run: python packaging/build_macos_release.py --output output/github-build/macos
      - name: Verify installed Mac payload and export DMG
        if: runner.os == 'macOS'
        run: python packaging/ci_verify_macos.py --build-root output/github-build/macos --export-dir output/ci-artifacts/macos
      - name: Save verified installer and receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LJQCApp-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/ci-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Save diagnostic receipts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-diagnostics-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/ci-checks/summary.json
            output/ci-checks/*/result.json
            output/ci-checks/*/run.log
            output/ci-verification/**/*.json
            output/ci-verification/**/*.log
            output/ci-artifacts/**/ci-verification.json
            output/ci-artifacts/**/frozen-service.log
            output/github-build/**/artifact.json
            output/github-build/**/build_info.json
            output/github-build/**/build_receipt.json
            output/github-build/**/release_payload_manifest.json
            output/github-build/**/logs/*.log
            output/github-build/**/logs/*.txt
            output/github-build/**/*-version*.txt
          if-no-files-found: warn
          retention-days: 3
