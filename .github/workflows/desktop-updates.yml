name: Desktop cumulative updates

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish both verified platform patches through the configured restricted identity'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - release.json
      - .gitattributes
      - .github/workflows/desktop-updates.yml
      - desktop_updates/**
      - packaging/**
      - resources/desktop_update_trust.json
      - resources/desktop_baselines/**
      - requirements.txt
      - tests/desktop_update*_smoke_test.py

permissions:
  contents: read

concurrency:
  group: desktop-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }} patch and update bootstrap
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2022
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      LJQC_DEPLOYMENT_MODE: desktop
    steps:
      - name: Preserve identical source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install native build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Run guarded source checks
        run: python packaging/ci_run_checks.py --output output/ci-checks
      - name: Run updater failure and recovery checks
        run: >-
          python -m unittest discover -s tests
          -p "desktop_update_packaging_smoke_test.py"
      - name: Prepare bootstrap installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/prepare_windows_ci.ps1
      - name: Build native Windows program without base Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./packaging/build_windows_release.ps1
          -PythonExe (Get-Command python).Source
          -OutputRoot "$env:GITHUB_WORKSPACE/output/github-update/windows"
          -SkipInstaller
      - name: Build native Mac program without base DMG
        if: runner.os == 'macOS'
        run: python packaging/build_macos_release.py --skip-dmg --output output/github-update/macos
      - name: Export and verify actual cumulative patch
        run: >-
          python packaging/ci_verify_update.py
          --target ${{ matrix.target }}
          --build-root output/github-update/${{ runner.os == 'Windows' && 'windows' || 'macos' }}
          --output output/ci-updates/${{ matrix.target }}
      - name: Build Windows one-time update bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python packaging/build_update_bootstrap.py
          --output output/ci-updates/${{ matrix.target }}
          --inno-compiler "$env:LJQC_CI_INNO_COMPILER"
          --chinese-messages "$env:LJQC_CI_CHINESE_MESSAGES"
      - name: Build Mac one-time update bootstrap
        if: runner.os == 'macOS'
        run: python packaging/build_update_bootstrap.py --output output/ci-updates/${{ matrix.target }}
      - name: Verify real 1.00 adoption and cumulative program update
        run: >-
          python packaging/ci_verify_update_adoption.py
          --target ${{ matrix.target }}
          --candidates output/ci-updates/${{ matrix.target }}
          --output output/ci-updates/${{ matrix.target }}
      - name: Retain verified candidates (not a server publication)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LJQCUpdate-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/ci-updates/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: update-diagnostics-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/ci-checks/summary.json
            output/ci-checks/*/result.json
            output/ci-checks/*/run.log
            output/ci-updates/**/*.json
            output/ci-updates/**/*.log
            output/github-update/**/artifact.json
            output/github-update/**/build_receipt.json
            output/github-update/**/build_info.json
            output/github-update/**/logs/*.log
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Sign and optionally publish the verified pair
    needs: build
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-update-publish.yml
    with:
      refresh_only: false
      publish: ${{ inputs.publish == true }}
    secrets: inherit
