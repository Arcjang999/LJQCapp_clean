name: Desktop update signing and restricted transfer

on:
  workflow_call:
    inputs:
      refresh_only:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
    secrets:
      LJQC_UPDATE_SIGNING_KEY:
        required: false
      LJQC_UPDATE_DEPLOY_KEY:
        required: false
      LJQC_UPDATE_KNOWN_HOSTS:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-update-publication
  cancel-in-progress: false

jobs:
  sign_and_transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: desktop-updates
    env:
      PYTHONUTF8: '1'
      SIGNING_KEY: ${{ secrets.LJQC_UPDATE_SIGNING_KEY }}
      DEPLOY_KEY: ${{ secrets.LJQC_UPDATE_DEPLOY_KEY }}
      KNOWN_HOSTS: ${{ secrets.LJQC_UPDATE_KNOWN_HOSTS }}
      DO_REFRESH: ${{ inputs.refresh_only }}
      MANUAL_PUBLISH_REQUEST: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Identify available publication capabilities
        id: capabilities
        env:
          # Resolve this only after the desktop-updates environment is active.
          AUTO_PUBLISH: ${{ vars.LJQC_UPDATES_AUTO_PUBLISH }}
          DEPLOY_HOST: ${{ vars.LJQC_UPDATE_DEPLOY_HOST || '159.75.243.120' }}
          DEPLOY_USER: ${{ vars.LJQC_UPDATE_DEPLOY_USER }}
        run: |
          python - <<'PY'
          import os, re, sys
          sys.path.insert(0, 'packaging')
          from update_publish_policy import should_publish
          signing = bool(os.environ.get('SIGNING_KEY'))
          deploying = signing and all(os.environ.get(name) for name in ('DEPLOY_KEY', 'KNOWN_HOSTS', 'DEPLOY_USER'))
          if deploying and (re.fullmatch(r'[a-z_][a-z0-9_-]{0,31}', os.environ['DEPLOY_USER']) is None or re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]{0,252}', os.environ['DEPLOY_HOST']) is None):
              raise ValueError('The configured dedicated SSH receiver identity is invalid')
          publishing = should_publish(ref=os.environ['GITHUB_REF'], event=os.environ['GITHUB_EVENT_NAME'], requested=os.environ.get('MANUAL_PUBLISH_REQUEST') == 'true', automatic_enabled=os.environ.get('AUTO_PUBLISH') == 'true')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('signing=' + str(signing).lower() + '\n')
              output.write('deploying=' + str(deploying).lower() + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DO_PUBLISH=' + str(publishing).lower() + '\n')
              if deploying:
                  output.write('DEPLOY_HOST=' + os.environ['DEPLOY_HOST'] + '\n')
                  output.write('DEPLOY_USER=' + os.environ['DEPLOY_USER'] + '\n')
          if not signing:
              print('::notice::Release signing is not configured. Native artifacts are candidates; nothing is published.')
          elif not deploying:
              print('::notice::Restricted server transfer is not configured. Signed artifacts can be retained, but nothing is published.')
          PY
      - name: Install signing and explicit HTTPS trust dependencies
        if: steps.capabilities.outputs.signing == 'true'
        run: python -m pip install cryptography==50.0.2 certifi==2026.7.22
      - name: Get both native candidates from this successful run
        if: steps.capabilities.outputs.signing == 'true' && env.DO_REFRESH != 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: LJQCUpdate-*
          path: output/update-inputs
          merge-multiple: true
      - name: Sign exactly the verified platform pair
        if: steps.capabilities.outputs.signing == 'true' && env.DO_REFRESH != 'true'
        env:
          LJQC_UPDATE_SIGNING_KEY: ${{ secrets.LJQC_UPDATE_SIGNING_KEY }}
        run: python packaging/publish_desktop_update.py sign --inputs output/update-inputs --output output/signed-update
      - name: Refresh only the current release metadata
        if: steps.capabilities.outputs.signing == 'true' && env.DO_REFRESH == 'true'
        env:
          LJQC_UPDATE_SIGNING_KEY: ${{ secrets.LJQC_UPDATE_SIGNING_KEY }}
        run: python packaging/publish_desktop_update.py refresh-metadata --output output/signed-update
      - name: Retain signed publication files
        id: signed_publication
        if: steps.capabilities.outputs.signing == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LJQCUpdate-signed-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/signed-update/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Transfer only through the restricted receiving command
        if: steps.capabilities.outputs.deploying == 'true' && env.DO_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_ARTIFACT_ID: ${{ steps.signed_publication.outputs.artifact-id }}
          SIGNED_ARTIFACT_SHA256: ${{ steps.signed_publication.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from resend_desktop_update import publish_current
          receipt = publish_current(Path('output/signed-update'), Path('resources/desktop_update_trust.json'),
              artifact_id=int(os.environ['SIGNED_ARTIFACT_ID']),
              artifact_sha256=os.environ['SIGNED_ARTIFACT_SHA256'])
          Path('output/update-publish-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: State when server publication was not requested
        if: steps.capabilities.outputs.signing == 'true' && env.DO_PUBLISH != 'true'
        run: echo 'Signed candidates retained. Server publication was not requested; the installed base and server channel are unchanged.'
